# H200 example. Validate the exact CUDA, driver, Torch, SGLang and NIXL matrix
# against the partner image before use; GPU model alone is not compatibility.
gpu:
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-H200
resources:
  requests: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
  limits: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "1"}
