{{- if not .Values.bootstrap.tokenSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talea-worker.fullname" . }}-bootstrap
  labels:
    {{- include "talea-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "bootstrap.token is required when bootstrap.tokenSecretName is empty" .Values.bootstrap.token | quote }}
{{- end }}
